services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - db-data:/data/db
      - app-storage:/var/www/html/storage
      - backups:/backups
      - caddy-data:/data/caddy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data: {}
  app-storage: {}
  backups: {}
  caddy-data: {}
